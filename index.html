<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Going Balls Pro</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; background: #0f172a; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    #ui {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 24px;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
    }
    #game-over {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
      padding: 32px 40px; border-radius: 24px; color: #fff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #game-over h1 { margin: 0 0 10px; font-size: 28px; color: #ff4757; }
    button {
      margin-top: 15px; padding: 12px 32px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 12px; background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(255,71,87,0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <div class="hud-card">МОНЕТЫ: <span id="score" style="color:#ffd32a">0</span></div>
    <div class="hud-card">СКОРОСТЬ: <span id="speed-meter" style="color:#2ed573">40</span> км/ч</div>
  </div>

  <div id="game-over">
    <h1 id="over-title">РАЗБИЛСЯ!</h1>
    <p id="final-score" style="font-size: 18px; margin: 0 0 15px;">Монеты: 0</p>
    <button onclick="restart()">ИГРАТЬ СНОВА</button>
  </div>

  <script>
    let scene, camera, renderer, ball;
    let forwardSpeed = 0.55;
    let lateralVelocity = 0;
    let verticalVelocity = 0;
    let isGrounded = true;
    let score = 0;
    let isGameOver = false;

    const obstacles = [];
    const coins = [];
    const ramps = [];
    const trackWidth = 8;
    const trackLength = 400;

    // Генерация текстуры для шара в стиле Going Balls
    function createBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ff3838';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 512; i += 64) {
        ctx.fillRect(i, 0, 32, 512);
      }
      ctx.fillStyle = '#17c0eb';
      ctx.beginPath();
      ctx.arc(256, 256, 120, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // Текстура полотна дороги с разметкой
    function createRoadTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e272e';
      ctx.fillRect(0, 0, 256, 512);

      ctx.fillStyle = '#ffa801';
      ctx.fillRect(10, 0, 10, 512);
      ctx.fillRect(236, 0, 10, 512);

      ctx.fillStyle = '#ffffff';
      for (let y = 0; y < 512; y += 80) {
        ctx.fillRect(123, y, 10, 40);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 40);
      return tex;
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x70a1ff);
      scene.fog = new THREE.FogExp2(0x70a1ff, 0.012);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      scene.add(hemiLight);

      const sun = new THREE.DirectionalLight(0xffffff, 0.9);
      sun.position.set(20, 40, 20);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 1024;
      sun.shadow.mapSize.height = 1024;
      scene.add(sun);

      // Дорога
      const roadGeo = new THREE.BoxGeometry(trackWidth, 0.8, trackLength);
      const roadMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.6 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.position.set(0, -0.4, -trackLength / 2 + 10);
      road.receiveShadow = true;
      scene.add(road);

      // Бортики дороги
      const railGeo = new THREE.BoxGeometry(0.4, 0.6, trackLength);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.4 });
      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-trackWidth / 2 - 0.2, 0.1, road.position.z);
      const rightRail = leftRail.clone();
      rightRail.position.x = trackWidth / 2 + 0.2;
      scene.add(leftRail, rightRail);

      // Шар
      const ballGeo = new THREE.SphereGeometry(0.7, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({
        map: createBallTexture(),
        roughness: 0.2,
        metalness: 0.1
      });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, 0.7, 0);
      ball.castShadow = true;
      scene.add(ball);

      // Генерация препятствий, рамп и монет
      for (let z = -25; z > -trackLength + 40; z -= 14) {
        const rand = Math.random();

        if (rand < 0.45) {
          // Шлагбаум / куб
          const obsGeo = new THREE.BoxGeometry(2.4, 1.2, 0.8);
          const obsMat = new THREE.MeshStandardMaterial({ color: 0x2f3542, roughness: 0.3 });
          const obs = new THREE.Mesh(obsGeo, obsMat);
          obs.position.set((Math.random() - 0.5) * (trackWidth - 3), 0.6, z);
          obs.castShadow = true;
          scene.add(obs);
          obstacles.push(obs);
        } else if (rand < 0.7) {
          // Трамплин
          const rampGeo = new THREE.BoxGeometry(3.5, 0.6, 3);
          const rampMat = new THREE.MeshStandardMaterial({ color: 0xffa502 });
          const ramp = new THREE.Mesh(rampGeo, rampMat);
          ramp.rotation.x = -Math.PI / 8;
          ramp.position.set((Math.random() - 0.5) * (trackWidth - 4), 0.1, z);
          ramp.receiveShadow = true;
          scene.add(ramp);
          ramps.push(ramp);
        }

        // Золотая монета
        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.12, 20);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.9, roughness: 0.1 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set((Math.random() - 0.5) * (trackWidth - 3), 1.2, z - 6);
        scene.add(coin);
        coins.push(coin);
      }

      // Управление свайпами
      let touchStartX = 0;
      window.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      window.addEventListener('touchmove', e => {
        const diff = (e.touches[0].clientX - touchStartX) * 0.04;
        lateralVelocity += diff;
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      // Управление клавиатурой
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') lateralVelocity -= 0.15;
        if (e.key === 'ArrowRight') lateralVelocity += 0.15;
      });

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      if (!isGameOver) {
        requestAnimationFrame(animate);

        // Инерция и физика влево-вправо
        ball.position.x += lateralVelocity;
        lateralVelocity *= 0.85; // гашение бокового заноса

        // Движение вперед и ускорение вращения
        ball.position.z -= forwardSpeed;
        ball.rotation.x -= forwardSpeed / 0.7;
        ball.rotation.z = -lateralVelocity * 1.5; // наклон шара при повороте

        // Гравитация и прыжки
        if (!isGrounded) {
          verticalVelocity -= 0.02;
          ball.position.y += verticalVelocity;
          if (ball.position.y <= 0.7) {
            ball.position.y = 0.7;
            verticalVelocity = 0;
            isGrounded = true;
          }
        }

        // Проверка трамплинов
        for (const ramp of ramps) {
          if (Math.abs(ball.position.z - ramp.position.z) < 1.5 &&
              Math.abs(ball.position.x - ramp.position.x) < 1.8) {
            verticalVelocity = 0.35;
            isGrounded = false;
          }
        }

        // Позиционирование камеры за шаром
        camera.position.x = ball.position.x * 0.4;
        camera.position.y = ball.position.y + 3.8;
        camera.position.z = ball.position.z + 7.5;
        camera.lookAt(ball.position.x * 0.2, ball.position.y + 0.8, ball.position.z - 6);

        // Анимация монет и сбор
        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];
          coin.rotation.z += 0.05;
          if (ball.position.distanceTo(coin.position) < 1.1) {
            scene.remove(coin);
            coins.splice(i, 1);
            score += 1;
            document.getElementById('score').innerText = score;
          }
        }

        // Столкновение с препятствиями
        for (const obs of obstacles) {
          if (Math.abs(ball.position.z - obs.position.z) < 0.9 &&
              Math.abs(ball.position.x - obs.position.x) < 1.6 &&
              ball.position.y < 1.3) {
            endGame("РАЗБИЛСЯ!");
            break;
          }
        }

        // Падение в бездну
        if (Math.abs(ball.position.x) > trackWidth / 2 + 0.6) {
          isGrounded = false;
          verticalVelocity -= 0.03;
          ball.position.y += verticalVelocity;
          if (ball.position.y < -8) {
            endGame("УПАЛ С ТРАССЫ!");
          }
        }
      }
      renderer.render(scene, camera);
    }

    function endGame(reason) {
      isGameOver = true;
      document.getElementById('over-title').innerText = reason;
      document.getElementById('final-score').innerText = `Собрано монет: ${score}`;
      document.getElementById('game-over').style.display = 'block';
    }

    function restart() {
      location.reload();
    }

    init();
  </script>
</body>
</html>
