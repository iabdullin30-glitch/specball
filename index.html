<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Going Balls Pro</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; background: #1a1e29; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    #hud {
      position: absolute; top: 16px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none; z-index: 10;
    }
    .top-bar {
      display: flex; justify-content: space-between; width: 90%; max-width: 420px;
    }
    .badge {
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      padding: 8px 16px; border-radius: 20px; color: #fff;
      font-size: 16px; font-weight: 800; border: 1px solid rgba(255,255,255,0.15);
    }
    #progress-container {
      width: 70%; max-width: 320px; height: 10px;
      background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }
    #progress-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #2ed573, #7bed9f);
      transition: width 0.1s ease-out;
    }

    .modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px);
      padding: 30px 40px; border-radius: 24px; color: #fff;
      border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      z-index: 20; min-width: 260px;
    }
    .modal h1 { margin: 0 0 12px; font-size: 26px; }
    .btn {
      margin-top: 16px; padding: 12px 30px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 14px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #1e90ff, #3742fa);
      box-shadow: 0 6px 20px rgba(30,144,255,0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="top-bar">
      <div class="badge">🪙 <span id="score" style="color:#ffd32a">0</span></div>
      <div class="badge">🏁 <span id="dist">0</span>м</div>
    </div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="win-modal" class="modal">
    <h1 style="color:#2ed573">УРОВЕНЬ ПРОЙДЕН!</h1>
    <p id="win-coins" style="margin: 0; font-size: 18px;"></p>
    <button class="btn" onclick="restart()">СЛЕДУЮЩИЙ УРОВЕНЬ</button>
  </div>

  <div id="lose-modal" class="modal">
    <h1 style="color:#ff4757">РАЗБИЛСЯ!</h1>
    <p id="lose-reason" style="margin: 0; font-size: 16px; color:#ced6e0;"></p>
    <button class="btn" style="background: linear-gradient(135deg, #ff4757, #ff6b81);" onclick="restart()">ЗАНОВО</button>
  </div>

  <script>
    let scene, camera, renderer, ball;
    const trackWidth = 7;
    const startZ = 0;
    const finishZ = -320;
    
    let forwardSpeed = 0.52;
    let targetX = 0;
    let score = 0;
    let isGameOver = false;

    const obstacles = [];
    const coins = [];

    // Текстура мяча с контрастным рисунком
    function getBallTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      for (let x = 0; x < 512; x += 128) {
        ctx.fillRect(x, 0, 64, 512);
      }
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.arc(256, 256, 120, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(cv);
    }

    // Текстура финишного флага
    function getCheckerTexture() {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 128;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#1e272e';
      ctx.fillRect(0, 0, 64, 64);
      ctx.fillRect(64, 64, 64, 64);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 2);
      return tex;
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x81ecec);
      scene.fog = new THREE.Fog(0x81ecec, 40, 110);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x636e72, 0.7);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 30, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Основная трасса
      const trackLen = Math.abs(finishZ);
      const roadGeo = new THREE.BoxGeometry(trackWidth, 1, trackLen);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.5 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.position.set(0, -0.5, finishZ / 2);
      road.receiveShadow = true;
      scene.add(road);

      // Безопасные бортики по бокам дороги
      const railGeo = new THREE.BoxGeometry(0.4, 0.8, trackLen);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xf1f2f6, roughness: 0.3 });
      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-trackWidth / 2, 0.2, road.position.z);
      const rightRail = leftRail.clone();
      rightRail.position.x = trackWidth / 2;
      scene.add(leftRail, rightRail);

      // Финишная площадка
      const finishPadGeo = new THREE.CylinderGeometry(trackWidth / 2 + 1, trackWidth / 2 + 1, 1, 32);
      const finishPadMat = new THREE.MeshStandardMaterial({ color: 0x00b894 });
      const finishPad = new THREE.Mesh(finishPadGeo, finishPadMat);
      finishPad.position.set(0, -0.5, finishZ - 4);
      finishPad.receiveShadow = true;
      scene.add(finishPad);

      // Финишная арка
      const archMat = new THREE.MeshStandardMaterial({ color: 0x0984e3 });
      const poleGeo = new THREE.BoxGeometry(0.6, 6, 0.6);
      const pLeft = new THREE.Mesh(poleGeo, archMat);
      pLeft.position.set(-trackWidth / 2 + 0.4, 3, finishZ);
      const pRight = pLeft.clone();
      pRight.position.x = trackWidth / 2 - 0.4;

      const bannerGeo = new THREE.BoxGeometry(trackWidth, 1.6, 0.4);
      const bannerMat = new THREE.MeshStandardMaterial({ map: getCheckerTexture() });
      const banner = new THREE.Mesh(bannerGeo, bannerMat);
      banner.position.set(0, 5, finishZ);
      scene.add(pLeft, pRight, banner);

      // Шар игрока
      const ballGeo = new THREE.SphereGeometry(0.7, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({ map: getBallTexture(), roughness: 0.25 });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, 0.7, 0);
      ball.castShadow = true;
      scene.add(ball);

      // Расстановка блоков и монет
      for (let z = -25; z > finishZ + 25; z -= 18) {
        // Блок-препятствие
        const obsGeo = new THREE.BoxGeometry(2.2, 1.2, 0.8);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xd63031, roughness: 0.4 });
        const obs = new THREE.Mesh(obsGeo, obsMat);
        const obsX = (Math.random() - 0.5) * (trackWidth - 3.2);
        obs.position.set(obsX, 0.6, z);
        obs.castShadow = true;
        scene.add(obs);
        obstacles.push(obs);

        // Монета с противоположной стороны от блока
        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xfdcb6e, metalness: 0.8, roughness: 0.2 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(-obsX * 0.7, 0.8, z - 4);
        scene.add(coin);
        coins.push(coin);
      }

      // Адаптивное и плавное сенсорное управление
      let touchStartX = 0;
      let activeTouch = false;

      window.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        activeTouch = true;
      }, { passive: true });

      window.addEventListener('touchmove', e => {
        if (!activeTouch) return;
        const deltaX = e.touches[0].clientX - touchStartX;
        touchStartX = e.touches[0].clientX;

        // Мягкий коэффициент чувствительности: шар не улетает мгновенно
        targetX += deltaX * 0.018;

        // Не даем целевой точке выйти за бортики
        const limit = trackWidth / 2 - 0.9;
        targetX = Math.max(-limit, Math.min(limit, targetX));
      }, { passive: true });

      window.addEventListener('touchend', () => { activeTouch = false; });

      // Управление стрелками для проверки на ПК
      window.addEventListener('keydown', e => {
        const limit = trackWidth / 2 - 0.9;
        if (e.key === 'ArrowLeft') targetX = Math.max(-limit, targetX - 0.8);
        if (e.key === 'ArrowRight') targetX = Math.min(limit, targetX + 0.8);
      });

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      if (isGameOver) {
        renderer.render(scene, camera);
        return;
      }

      requestAnimationFrame(animate);

      // Движение вперед и плавное приближение к целевому положению пальца
      ball.position.z -= forwardSpeed;
      ball.position.x += (targetX - ball.position.x) * 0.14;

      // Реалистичное кручение шара
      ball.rotation.x -= forwardSpeed / 0.7;
      ball.rotation.z = (ball.position.x - targetX) * 0.5;

      // Камера плавно следует за мячом
      camera.position.x = ball.position.x * 0.4;
      camera.position.y = ball.position.y + 3.6;
      camera.position.z = ball.position.z + 7.5;
      camera.lookAt(ball.position.x * 0.2, ball.position.y + 0.6, ball.position.z - 5);

      // Обновление прогресса
      const progress = Math.min(100, Math.max(0, (ball.position.z / finishZ) * 100));
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('dist').innerText = Math.floor(Math.abs(ball.position.z));

      // Проверка победы (финиш)
      if (ball.position.z <= finishZ) {
        levelComplete();
        return;
      }

      // Вращение и подбор монет
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.rotation.z += 0.05;
        if (ball.position.distanceTo(coin.position) < 1.0) {
          scene.remove(coin);
          coins.splice(i, 1);
          score += 1;
          document.getElementById('score').innerText = score;
        }
      }

      // Проверка столкновения с блоками
      for (const obs of obstacles) {
        if (Math.abs(ball.position.z - obs.position.z) < 0.9 &&
            Math.abs(ball.position.x - obs.position.x) < 1.6) {
          loseGame("Врезался в препятствие!");
          return;
        }
      }
    }

    function levelComplete() {
      isGameOver = true;
      document.getElementById('win-coins').innerText = `Собрано монет: ${score}`;
      document.getElementById('win-modal').style.display = 'block';
    }

    function loseGame(reason) {
      isGameOver = true;
      document.getElementById('lose-reason').innerText = reason;
      document.getElementById('lose-modal').style.display = 'block';
    }

    function restart() {
      location.reload();
    }

    init();
  </script>
</body>
</html>
